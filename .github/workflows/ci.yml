name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/HardwareTempWidget.Core.Tests/HardwareTempWidget.Core.Tests.csproj --no-build --configuration Release

  publish:
    name: Publish app (main only)
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish framework-dependent win-x64 build
        run: >
          dotnet publish src/HardwareTempWidget.App/HardwareTempWidget.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HardwareTempWidget-win-x64
          path: publish/**
          if-no-files-found: error

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath HardwareTempWidget-win-x64.zip

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = Select-String -Path src/HardwareTempWidget.App/HardwareTempWidget.App.csproj -Pattern '<Version>(.*)</Version>' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check tag
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $exists = git ls-remote --tags origin "refs/tags/$tag"
          "exists=$([bool]$exists)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.version.outputs.version != '' && steps.tag.outputs.exists == 'False'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: HardwareTempWidget v${{ steps.version.outputs.version }}
          make_latest: true
          body: Automated build from commit ${{ github.sha }}.
          files: HardwareTempWidget-win-x64.zip
